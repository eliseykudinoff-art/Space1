# Space1 — Compliance Rules
# Правила для GammaVeto (Γ)
# Эти правила пользователь может менять без изменения кода

# =============================================================================
# FINANCIAL RULES
# =============================================================================
financial:
  max_cost_per_task: 10.0      # $ — максимальная стоимость задачи
  max_total_cost: 1000.0       # $ — максимальный бюджет
  min_balance: 0.0             # $ — минимальный баланс

# =============================================================================
# ACTION RULES
# =============================================================================
actions:
  blocked_actions:
    - "delete_all"
    - "drop_database"
    - "rm_rf"
    - "sudo"
  
  allowed_actions:
    - "read_file"
    - "write_file"
    - "execute_code"
    - "send_message"
    - "search_web"
    - "create_task"

# =============================================================================
# API RULES
# =============================================================================
api:
  rate_limit_per_minute: 60
  max_retries: 3
  timeout_seconds: 30

# =============================================================================
# SECURITY RULES
# =============================================================================
security:
  blocked_domains:
    - "evil.com"
    - "malware.net"
    - "phishing.example"
  
  require_approval_for:
    - "payment"
    - "external_api"
    - "credential_access"

# =============================================================================
# DATA RULES
# =============================================================================
data:
  max_file_size_mb: 100
  retention_days: 30  # GDPR compliance
  allowed_extensions:
    - ".py"
    - ".js"
    - ".md"
    - ".json"
    - ".yaml"
    - ".txt"

# =============================================================================
# PARAMETER CONSTRAINTS
# =============================================================================
parameters:
  budget:
    min: 0.0
    max: 10000.0
  
  time_hours:
    min: 0.1
    max: 168.0  # 1 week
  
  priority:
    min: 0.0
    max: 1.0
