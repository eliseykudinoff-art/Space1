# --- Настройки роутера ---
router:
  strategy: "maximize_uptime"     # maximize_uptime | maximize_quality | maximize_speed
  fallback_chain: true            # Автоматически переключаться при ошибке
  health_check_interval: 300      # Проверка серверов каждые 5 минут
  retry_attempts: 3               # Попыток перед переключением
  retry_delay: 2                  # Секунд между попытками
  token_budget_tracking: true     # Отслеживать расход токенов
  prefer_models:                  # Предпочтительные модели (по качеству)
    - "llama-3.3-70b"
    - "qwen2.5-72b"
    - "mixtral-8x7b"
    - "llama-3.1-8b"


# ═══════════════════════════════════════════════════════════════
# 🧠 ПАМЯТЬ И КОНТЕКСТ
# ═══════════════════════════════════════════════════════════════
memory:
  storage_dir: "./memory_store"           # Директория хранения
  max_session_messages: 50                # Макс. сообщений в сессии
  max_context_tokens: 4000                # Макс. токенов контекста для LLM
  max_facts: 1000                         # Макс. фактов в хранилище
  max_entities: 500                       # Макс. сущностей
  auto_extract_facts: true                # Автоизвлечение фактов из диалогов
  auto_extract_entities: true             # Автоизвлечение сущностей
  include_facts_in_context: true          # Добавлять факты в контекст LLM
  include_session_summary: true           # Добавлять резюме предыдущей сессии
  max_relevant_facts: 10                  # Макс. фактов в одном контексте
  fact_relevance_decay: 0.95              # Затухание релевантности (0-1)
